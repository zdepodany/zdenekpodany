<form class="contact-form">
  <div class="form-group">
    <label for="name">Jméno</label>
    <input type="text" id="name" name="name" required placeholder="Vaše jméno" />
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="vas@email.cz" />
  </div>
  <div class="form-group">
    <label for="service">Požadovaná služba</label>
    <select id="service" name="service" required defaultValue="">
      <option value="" disabled selected>Vyberte službu</option>
      <option value="Jednoduchý prezentační web">Jednoduchý prezentační web</option>
      <option value="Web na rozjezd podnikání">Web na rozjezd podnikání</option>
      <option value="UI/UX Audit">UI/UX Audit</option>
      <option value="Ještě nevím">Ještě nevím</option>
    </select>
  </div>
  <div class="form-group">
    <label for="message">Co vás zajímá?</label>
    <textarea id="message" name="message" rows="4" required placeholder="Napište mi, co potřebujete – typ webu, termín, dotazy..."></textarea>
  </div>
  <button type="submit" class="btn btn-primary btn-full">Odeslat zprávu</button>
</form>
<div id="form-feedback" class="form-feedback" role="status" aria-live="polite" hidden></div>
